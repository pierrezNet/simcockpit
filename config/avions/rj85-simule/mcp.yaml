# Avro RJ85, logique simulée : MCP (molettes, afficheurs, modes du pilote automatique RJ).

instruments:
  mcp:
    label: MCP (pilote automatique)
    card: mcp
    controls:
      crs1:
        type: encoder           # 1 changement d'état = 1 cran ; sens horaire = +
        inputs: [4, 5]
        min: 0
        max: 359
        wrap: true              # 359 → 0
        display: CRS1
        leading_zeros: true     # affiche 000, 045…
      vitesse:
        type: speed_encoder     # IAS en nœuds ou Mach en centièmes (78 = 0,78)
        inputs: [0, 1]
        toggle_input: 12        # bouton C/O
        toggle_level: 0         # le bouton C/O vaut 0 quand on appuie
        ias: [100, 340, 1]      # min, max, pas
        mach: [10, 99, 1]       # Mach .10 à .99
        altitude_from: altitude # C/O convertit IAS ↔ Mach à l'altitude affichée (ISA, QNH 1013)
        display: IAS
      cap:
        type: encoder
        inputs: [6, 7]
        min: 0
        max: 359
        wrap: true
        display: HDG
        leading_zeros: true     # affiche 000, 045…
      altitude:
        type: encoder
        inputs: [2, 3]
        min: 0
        max: 36000
        step: 100
        initial: 10000
        display: ALT
      vitesse_verticale:
        type: encoder
        inputs: [10, 11]
        min: -6000
        max: 6000
        step: 100
        invert: true            # molette vers DN = négatif
        accel: [[0.06, 5], [0.15, 2]]
        display: VS
      crs2:
        type: encoder
        inputs: [8, 9]
        min: 0
        max: 359
        wrap: true
        display: CRS2
        leading_zeros: true     # affiche 000, 045…
      pilote_auto:
        type: rj_autopilot      # logique RJ simulée (voir simcockpit/logic/rj_autopilot.py)
        buttons:                # poussoirs du MCP (1 au repos, 0 appuyé)
          N1: 29                # THRUST
          SPEED: 28             # THRUST aussi
          VNAV: 27
          LVL CHG: 26
          HDG SEL: 25           # HDG
          LNAV: 24
          VOR LOC: 23           # NAV
          APP: 22
          ALT HLD: 21           # ALT
          V/S: 20               # VS
          CMD A: 19             # NAV1
          CMD B: 18             # NAV2
          CWS A: 17             # sans effet (voyant = F/D gauche)
          CWS B: 16             # sans effet (voyant = F/D droit)
        fd_left: 15             # interrupteur F/D gauche (1 = ON)
        fd_right: 13            # interrupteur F/D droit
        at_arm: 30              # A/T ARM (1 = armé)
        disengage: 14           # barre DISENGAGE (0 = baissée)
