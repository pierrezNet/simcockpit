# Radio OpenCockpits (type Airbus) réglant les radios du Boeing 737-800 de Laminar.
# Noms vérifiés dans X-Plane 12/Resources/plugins (DataRefs.txt, Commands.txt).
# Unités X-Plane : COM en kHz (118000 → 118.000), NAV et ADF en 10 kHz d'après la doc
# (NAV 10950 → 109.50 ; ADF à confirmer en vol).

instruments:
  radio:
    label: Radio (COM / NAV / ADF)
    card: radio
    controls:
      boitier:
        type: radio_panel
        power: 12               # interrupteur ON/OFF (1 = ON, à confirmer)
        power_on: 0
        transfer: 4             # flèche de transfert
        outer: [2, 3]           # grande bague : MHz (« coarse »)
        inner: [1, 0]           # petite bague : kHz (« fine »)
        button_level: 0         # poussoirs : 0 pendant l'appui
        sources:
          COM1:
            inputs: 5           # VHF1
            leds: VHF1
            active: sim/cockpit2/radios/actuators/com1_frequency_hz_833
            standby: sim/cockpit2/radios/actuators/com1_standby_frequency_hz_833
            scale: 0.001
            decimals: 3
            flip: sim/radios/com1_standy_flip
            coarse: [sim/radios/stby_com1_coarse_down_833, sim/radios/stby_com1_coarse_up_833]
            fine: [sim/radios/stby_com1_fine_down_833, sim/radios/stby_com1_fine_up_833]
          COM2:
            inputs: 6           # VHF2
            leds: VHF2
            active: sim/cockpit2/radios/actuators/com2_frequency_hz_833
            standby: sim/cockpit2/radios/actuators/com2_standby_frequency_hz_833
            scale: 0.001
            decimals: 3
            flip: sim/radios/com2_standy_flip
            coarse: [sim/radios/stby_com2_coarse_down_833, sim/radios/stby_com2_coarse_up_833]
            fine: [sim/radios/stby_com2_fine_down_833, sim/radios/stby_com2_fine_up_833]
          NAV1:
            inputs: [7, 8]      # NAV et VOR
            leds: [NAV, VOR]
            active: sim/cockpit2/radios/actuators/nav1_frequency_hz
            standby: sim/cockpit2/radios/actuators/nav1_standby_frequency_hz
            scale: 0.01
            decimals: 2
            flip: sim/radios/nav1_standy_flip
            coarse: [sim/radios/stby_nav1_coarse_down, sim/radios/stby_nav1_coarse_up]
            fine: [sim/radios/stby_nav1_fine_down, sim/radios/stby_nav1_fine_up]
          NAV2:
            inputs: 9           # ILS
            leds: ILS
            active: sim/cockpit2/radios/actuators/nav2_frequency_hz
            standby: sim/cockpit2/radios/actuators/nav2_standby_frequency_hz
            scale: 0.01
            decimals: 2
            flip: sim/radios/nav2_standy_flip
            coarse: [sim/radios/stby_nav2_coarse_down, sim/radios/stby_nav2_coarse_up]
            fine: [sim/radios/stby_nav2_fine_down, sim/radios/stby_nav2_fine_up]