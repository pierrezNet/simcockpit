# Carte des vitesses du BAe 146 sur l'écran à encre (LilyGo T5 4,7", wifi, IOCP).
# Livret « BAe 146 Series 300, Non-Limiting Speed charts, 27000-46000 kg », tiré du
# manuel de vol du 146-300, températures moyennes, vitesses en kt IAS ; atterrissage
# normal volets 33° et 24°, anormal 30°, 18° et 0°.
# Le livret a une page par masse, aux valeurs fixes ; Pepit prend la page de la masse
# immédiatement supérieure à celle de l'avion et l'envoie à l'écran (variables 210 à 223).
# Une case absente d'une page vaut 0 : l'écran affiche un tiret.
# Programme de l'écran : arduino/carte_vitesses_bae146/.
#
# Pour ajouter une page : recopier le bloc « 38000: » sous une autre masse et y mettre les
# valeurs du livret. Pas besoin de reprogrammer l'écran.

instruments:
  carte_vitesses:
    label: Carte des vitesses (écran à encre)
    card: ecran_vitesses
    controls:
      livret:
        type: iocp_lookup
        source: masse.totale
        choix: superieur          # page de la masse immédiatement supérieure
        variables:
          page: 210               # masse de la page (kg)
          vr_18: 211              # décollage, volets 18°
          v2_18: 212
          vr_24: 213              # décollage, volets 24°
          v2_24: 214
          vr_30: 215              # décollage, volets 30°
          v2_30: 216
          vfto: 217
          ver: 218
          vref_33: 219            # atterrissage
          vref_30: 220
          vref_24: 221
          vref_18: 222
          vref_0: 223
        pages:                    # livret 146-300, saisi le 2026-11-25
          27000: {vr_18: 104, vr_24: 96, vr_30: 90, v2_18: 115, v2_24: 106, v2_30: 100,
                  vfto: 147, ver: 157, vref_33: 100, vref_24: 114, vref_30: 106, vref_18: 125, vref_0: 155}
          28000: {vr_18: 106, vr_24: 98, vr_30: 90, v2_18: 117, v2_24: 107, v2_30: 100,
                  vfto: 151, ver: 161, vref_33: 102, vref_24: 116, vref_30: 108, vref_18: 127, vref_0: 158}
          29000: {vr_18: 108, vr_24: 100, vr_30: 92, v2_18: 119, v2_24: 109, v2_30: 101,
                  vfto: 154, ver: 164, vref_33: 104, vref_24: 117, vref_30: 109, vref_18: 128, vref_0: 160}
          30000: {vr_18: 111, vr_24: 102, vr_30: 94, v2_18: 120, v2_24: 110, v2_30: 103,
                  vfto: 157, ver: 167, vref_33: 106, vref_24: 119, vref_30: 111, vref_18: 130, vref_0: 163}
          31000: {vr_18: 113, vr_24: 104, vr_30: 96, v2_18: 122, v2_24: 112, v2_30: 105,
                  vfto: 159, ver: 169, vref_33: 108, vref_24: 121, vref_30: 113, vref_18: 132, vref_0: 166}
          32000: {vr_18: 115, vr_24: 106, vr_30: 98, v2_18: 124, v2_24: 114, v2_30: 106,
                  vfto: 162, ver: 172, vref_33: 109, vref_24: 122, vref_30: 115, vref_18: 134, vref_0: 168}
          33000: {vr_18: 117, vr_24: 108, vr_30: 100, v2_18: 125, v2_24: 115, v2_30: 108,
                  vfto: 165, ver: 175, vref_33: 111, vref_24: 124, vref_30: 116, vref_18: 135, vref_0: 171}
          34000: {vr_18: 120, vr_24: 110, vr_30: 102, v2_18: 127, v2_24: 117, v2_30: 109,
                  vfto: 167, ver: 177, vref_33: 113, vref_24: 126, vref_30: 118, vref_18: 137, vref_0: 173}
