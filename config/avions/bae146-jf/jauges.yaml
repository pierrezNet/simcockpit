# Jauges EFDE du bus FDBUS. Chaque jauge est désignée par le nom qu'on lui a donné dans
# le banc de test (onglet FDBUS) : c'est là que se règlent sa sortie de module et
# l'étalonnage de son cadran (config/fdbus.yaml). Ici, on dit seulement quelle valeur
# du simulateur elle indique (« fonction: », voir config/dictionnaire/xplane.yaml).
# `scale` multiplie la valeur reçue (ex. un rapport 0-1 → degrés).
# Une seule appli pilote le bus : fermer le banc de test avant de lancer le panneau.

instruments:
  jauges:
    label: Jauges
    card: jauges
    controls:
      vitesse_verticale:
        type: gauge
        gauge: Vitesse verticale
        fonction: vitesse_verticale
      volets:
        type: gauge
        gauge: Volets
        fonction: volets.angle
