# MCP OpenCockpits (boutons de 737) relié au pilote automatique du BAe 146 de Just Flight.
# Le 146 n'a pas de MCP mais un sélecteur de modes sur le glareshield et un boîtier AP / YD
# sur la console centrale arrière. Les fonctions (pa.mode.hdg, pa.engage…) et leurs voyants
# sont dans fonctions.yaml (boutons Thranda) et dans le dictionnaire standard d'X-Plane ;
# la LED de chaque bouton du MCP suit le voyant de son mode.
#
#   MCP (737)   146                 MCP (737)   146
#   HDG SEL  →  HDG                 LVL CHG  →  IAS
#   VOR LOC  →  V/L                 SPEED    →  MACH
#   APP      →  GSL (plan ILS)      N1       →  TURB
#   ALT HLD  →  ALT                 CWS A    →  ALT ARM
#   V/S      →  VS                  CWS B    →  B LOC
#   LNAV     →  L NAV               CMD A    →  AP (engage / désengage)
#   VNAV     →  V NAV               CMD B    →  YD (amortisseur de lacet)
#   barre DISENGAGE baissée → déconnexion du PA (comme le bouton de la poignée)
#
# Molettes : HDG, CRS1 / CRS2 (COURSE NAV1 / NAV2) et ALT (ALT SEL) sont les consignes
# standard d'X-Plane. IAS et V/S restent éteints : le 146 n'a pas de consigne de vitesse
# ni de vitesse verticale (il tient la valeur du moment où le mode s'engage).
# Conditions pour engager le PA : AVIONICS MASTER A et B, A/P MSTR (plafonnier) sur ON.

instruments:
  mcp:
    label: Pilote automatique 146
    card: mcp
    controls:
      crs1:
        type: encoder
        inputs: [4, 5]
        min: 0
        max: 359
        wrap: true
        display: CRS1
        leading_zeros: true
        fonction: nav1.course
      cap:
        type: encoder
        inputs: [6, 7]
        min: 0
        max: 359
        wrap: true
        display: HDG
        leading_zeros: true
        fonction: pa.cap
      altitude:
        type: encoder
        inputs: [2, 3]
        min: 0
        max: 35000
        step: 100
        display: ALT
        min_digits: 3
        fonction: pa.altitude
      crs2:
        type: encoder
        inputs: [8, 9]
        min: 0
        max: 359
        wrap: true
        display: CRS2
        leading_zeros: true
        fonction: nav2.course          # côté commandant : la valeur copilote n'arrive pas au 146

      boutons:
        type: commands
        level: 0                      # poussoirs du MCP : 0 pendant l'appui
        inputs:
          25: pa.mode.hdg                  # HDG SEL
          23: pa.mode.vl                   # VOR LOC
          22: pa.mode.gsl                  # APP
          21: pa.mode.alt                  # ALT HLD
          20: pa.mode.vs                   # V/S
          26: pa.mode.ias                  # LVL CHG
          28: pa.mode.mach                 # SPEED
          24: pa.mode.lnav                 # LNAV
          27: pa.mode.vnav                 # VNAV
          29: pa.mode.turb                 # N1
          16: pa.mode.bloc                 # CWS B
          17: pa.altitude_arm              # CWS A
          19: pa.engage                    # CMD A (bouton AP de la console centrale)
          18: amortisseur_lacet.engage     # CMD B (bouton YD de la console centrale)

      voyants:
        type: sim_leds
        leds:
          HDG SEL: pa.mode.hdg.voyant
          VOR LOC: pa.mode.vl.voyant
          APP: pa.mode.gsl.voyant
          ALT HLD: pa.mode.alt.voyant
          V/S: pa.mode.vs.voyant
          LVL CHG: pa.mode.ias.voyant
          SPEED: pa.mode.mach.voyant
          LNAV: pa.mode.lnav.voyant
          VNAV: pa.mode.vnav.voyant
          N1: pa.mode.turb.voyant
          CWS B: pa.mode.bloc.voyant
          CWS A: pa.altitude_arm.voyant
          CMD A: pa.engage.voyant
          CMD B: amortisseur_lacet.engage.voyant

      fd_gauche:
        type: switch
        input: 15
        fonction: fd.gauche
      fd_droit:
        type: switch
        input: 13
        fonction: fd.droit
      disengage:
        type: switch
        input: 14
        invert: true                  # « on » = barre baissée (entrée à 0)
        command_on: pa.deconnexion
