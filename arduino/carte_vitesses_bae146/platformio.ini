; Carte des vitesses du BAe 146 sur écran à encre LilyGo T5 4,7" (ESP32 + PSRAM, 960 x 540),
; projet PlatformIO. Compiler : pio run ; téléverser : pio run -t upload.
; Avant : copier secrets.h.example en secrets.h.

[platformio]
src_dir = .
default_envs = usb

[env]
platform = espressif32@6.12.0     ; version attendue par la bibliothèque LilyGo-EPD47 (la 8.x ne compile pas sur ESP32)
framework = arduino
board = esp32dev                ; LilyGo T5 4,7" V2.3 : ESP32, 16 Mo de flash, PSRAM
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue -DLILYGO_T5_EPD47
monitor_speed = 115200
lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git

[env:usb]

; Téléversement en wifi (OTA), à l'adresse fixe de ce programme (192.168.1.51).
; Par câble : environnement usb (groupe dialout, ou « sg dialout -c "pio run -e usb -t upload" »).
[env:ota]
upload_protocol = espota
upload_port = 192.168.1.51
