; Afficheur carburant du BAe 146 (ESP8266 + OLED SSD1306), projet PlatformIO.
; Dans VS Code : ouvrir ce dossier (arduino/carburant_bae146) avec PlatformIO, puis
; « Build » et « Upload » en bas de la fenêtre. Avant : copier secrets.h.example en secrets.h.

[platformio]
src_dir = .                     ; le programme reste carburant_bae146.ino, dans ce dossier
default_envs = ota

[env]
platform = espressif8266
framework = arduino
board = esp12e                  ; module ESP-12 (4 Mo), celui des cartes type D1 mini
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

; Téléversement par câble USB (il faut être dans le groupe dialout, voir le README)
[env:usb]

; Téléversement en wifi (OTA), à l'adresse fixe de ce programme (192.168.1.50).
; Premier téléversement depuis l'ancien programme du MD-80 : 192.168.1.244 (son
; « 192.168.1.500 » débordait).
[env:ota]
upload_protocol = espota
upload_port = 192.168.1.50
