site_name: Pepit
site_description: Pilotage libre, sous Linux, des cartes de cockpit de simulateur (OpenCockpits, EFDE, Arduino) avec X-Plane 12.
site_url: https://pierreznet.github.io/pepit/
repo_url: https://github.com/pierrezNet/pepit
repo_name: pierrezNet/pepit
edit_uri: edit/main/docs/
copyright: Pepit est un logiciel libre sous licence GPL-3.0-or-later.

theme:
  name: material
  language: fr
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Source Sans 3
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - navigation.instant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite

nav:
  - Accueil: index.md
  - Démarrer:
      - Installation: demarrage/installation.md
      - Premiers pas: demarrage/premiers-pas.md
  - Utiliser:
      - Le banc de test: utilisation/banc.md
      - Le cockpit et X-Plane: utilisation/cockpit.md
      - Ligne de commande: utilisation/ligne-de-commande.md
  - Configurer:
      - Organisation: configuration/index.md
      - Dictionnaire des fonctions: configuration/dictionnaire.md
      - Types de commandes: configuration/types.md
  - Matériel:
      - Cartes USB: materiel/cartes.md
      - Cartes wifi (IOCP): materiel/cartes-wifi.md
  - Avions:
      - BAe 146 (Just Flight): avions/bae146.md
      - Boeing 737-800 (Laminar): avions/b737.md
      - Avro RJ85 simulé: avions/rj85-simule.md
  - Référence:
      - Protocoles: reference/protocoles.md
      - Contribuer: reference/contribuer.md

validation:
  links:
    anchors: warn          # un lien vers une section absente fait échouer « mkdocs build --strict »
